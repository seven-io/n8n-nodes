# pnpm settings (pnpm >=10 reads these from pnpm-workspace.yaml, not package.json)
# Neither package needs its install-time build script for lint/test/build here.
allowBuilds:
  eslint-plugin-n8n-nodes-base: false
  isolated-vm: false
# Security fixes for transitive dev dependencies (n8n-workflow, jest, eslint, gulp)
overrides:
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  handlebars@<4.7.10: ^4.7.10
  js-yaml@<3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  lodash@<4.18.0: ^4.18.0
  uuid@<11.1.1: ^11.1.1
