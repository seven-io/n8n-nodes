name: Publish to npm
# n8n requires community nodes to be published from GitHub Actions with provenance.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1

      - name: Check release tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      # npm instead of pnpm publish: OIDC trusted publishing and provenance are reliably supported there
      - run: npm publish --provenance --access public
